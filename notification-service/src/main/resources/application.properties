spring.application.name=notification-service
server.port=8088

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/flowboard_notification?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123Kanhiya@
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT - must match across ALL services
jwt.secret=mysecretkeymysecretkeymysecretkey
jwt.expiration=86400000

# Inter-service URLs
auth.service.url=http://localhost:8081

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Notification exchange config (must match comment-service)
rabbitmq.exchange=flowboard.exchange
rabbitmq.notification.routing-key=notification.event
rabbitmq.notification.queue=flowboard.notification.queue

logging.level.com.flowboard=DEBUG

