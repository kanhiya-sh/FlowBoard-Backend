spring.application.name=auth-service
server.port=8081

spring.config.import=optional:file:./.env[.properties]

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_AUTH_URL:jdbc:mysql://localhost:3306/flowboard_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ──────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── Google OAuth2 ────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# redirect-uri — browser hits auth-service directly (port 8081) for OAuth2.
# Must match EXACTLY what is registered in Google Cloud Console.
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8081/login/oauth2/code/google

# ─── Frontend redirect after OAuth2 success/failure ──────────────────────────
# After Google callback, auth-service redirects browser to Angular with token.
# Must match the route in Angular: /oauth2/redirect (OAuthCallbackComponent)
app.oauth2.success-redirect-url=http://localhost:4200/oauth2/redirect
app.oauth2.failure-redirect-url=http://localhost:4200/login

# ─── Session cookie ───────────────────────────────────────────────────────────
# SameSite=LAX required — session cookie must survive the Google redirect round-trip
# (browser leaves auth-service → goes to Google → comes back to auth-service)
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.http-only=true

# ─── Redis Cache ──────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# ─── Eureka ───────────────────────────────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.ip-address=127.0.0.1
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ─── Swagger ──────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
