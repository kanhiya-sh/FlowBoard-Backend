name: SonarCloud Analysis

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      scan_all:
        description: 'Scan all services regardless of changes'
        type: boolean
        default: true

jobs:
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service: 'auth-service/**'
            api-gateway: 'api-gateway/**'
            board-service: 'board-service/**'
            card-service: 'card-service/**'
            comment-service: 'comment-service/**'
            eureka-server: 'eureka-server/**'
            label-service: 'label-service/**'
            list-service: 'list-service/**'
            notification-service: 'notification-service/**'
            workspace-service: 'workspace-service/**'

      - name: Decide which services to scan
        id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.scan_all }}" == "true" ]]; then
            echo 'services=["auth-service","api-gateway","board-service","card-service","comment-service","eureka-server","label-service","list-service","notification-service","workspace-service"]' >> $GITHUB_OUTPUT
          else
            echo "services=${{ steps.filter.outputs.changes }}" >> $GITHUB_OUTPUT
          fi

  scan:
    name: Scan ${{ matrix.service }}
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, Test & Sonar — ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B clean verify sonar:sonar \
            -Dsonar.projectKey=flowboard-${{ matrix.service }} \
            -Dsonar.organization=kanhiya-sh \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.java.source=17 \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml