# ───────── SERVER ─────────
server.port=8080

spring.application.name=api-gateway
spring.main.web-application-type=reactive

# ───────── GLOBAL CORS ─────────
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:4200,http://localhost:3000
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].maxAge=3600

# ───────── ROUTES ─────────

# AUTH
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# WORKSPACE
spring.cloud.gateway.routes[1].id=workspace-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/workspaces/**

# BOARD
spring.cloud.gateway.routes[2].id=board-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/boards/**

# LIST
spring.cloud.gateway.routes[3].id=list-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/lists/**

# CARD
spring.cloud.gateway.routes[4].id=card-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/cards/**

# COMMENT
spring.cloud.gateway.routes[5].id=comment-service
spring.cloud.gateway.routes[5].uri=http://localhost:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/comments/**

# ATTACHMENT (same service)
spring.cloud.gateway.routes[6].id=attachment-service
spring.cloud.gateway.routes[6].uri=http://localhost:8086
spring.cloud.gateway.routes[6].predicates[0]=Path=/attachments/**

# LABEL
spring.cloud.gateway.routes[7].id=label-service
spring.cloud.gateway.routes[7].uri=http://localhost:8087
spring.cloud.gateway.routes[7].predicates[0]=Path=/labels/**

# CHECKLIST (same service)
spring.cloud.gateway.routes[8].id=checklist-service
spring.cloud.gateway.routes[8].uri=http://localhost:8087
spring.cloud.gateway.routes[8].predicates[0]=Path=/checklists/**

# NOTIFICATION
spring.cloud.gateway.routes[9].id=notification-service
spring.cloud.gateway.routes[9].uri=http://localhost:8088
spring.cloud.gateway.routes[9].predicates[0]=Path=/notifications/**

# ───────── DEFAULT FILTERS ─────────
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

# ───────── ACTUATOR ─────────
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# ───────── SERVICE URLS (for @Value injection) ─────────
services.auth.url=http://localhost:8081
services.workspace.url=http://localhost:8082
services.board.url=http://localhost:8083
services.list.url=http://localhost:8084
services.card.url=http://localhost:8085
services.comment.url=http://localhost:8086
services.label.url=http://localhost:8087
services.notification.url=http://localhost:8088

# ───────── LOGGING ─────────
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.flowboard.gateway=DEBUG
logging.level.reactor.netty=WARN