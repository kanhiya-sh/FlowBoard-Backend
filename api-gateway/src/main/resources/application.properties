# ───────── SERVER ─────────
server.port=8080

spring.application.name=api-gateway
spring.main.web-application-type=reactive

# ───────── CORS ─────────
# Single source of truth: CorsConfig.java (CorsWebFilter bean) — do NOT duplicate here.

# ───────── ROUTES ─────────

# Enable service-discovery-based routing (lb:// URIs)
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# AUTH
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# WORKSPACE
spring.cloud.gateway.routes[1].id=workspace-service
spring.cloud.gateway.routes[1].uri=lb://WORKSPACE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/workspaces/**

# BOARD
spring.cloud.gateway.routes[2].id=board-service
spring.cloud.gateway.routes[2].uri=lb://BOARD-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/boards/**

# LIST
spring.cloud.gateway.routes[3].id=list-service
spring.cloud.gateway.routes[3].uri=lb://LIST-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/lists/**

# CARD
spring.cloud.gateway.routes[4].id=card-service
spring.cloud.gateway.routes[4].uri=lb://CARD-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/cards/**

# COMMENT
spring.cloud.gateway.routes[5].id=comment-service
spring.cloud.gateway.routes[5].uri=lb://COMMENT-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/comments/**

# ATTACHMENT (same service)
spring.cloud.gateway.routes[6].id=attachment-service
spring.cloud.gateway.routes[6].uri=lb://COMMENT-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/attachments/**

# LABEL
spring.cloud.gateway.routes[7].id=label-service
spring.cloud.gateway.routes[7].uri=lb://LABEL-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/labels/**

# CHECKLIST (same service)
spring.cloud.gateway.routes[8].id=checklist-service
spring.cloud.gateway.routes[8].uri=lb://LABEL-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/checklists/**

# NOTIFICATION
spring.cloud.gateway.routes[9].id=notification-service
spring.cloud.gateway.routes[9].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/notifications/**

# ───────── DEFAULT FILTERS ─────────
# Strip duplicate CORS headers that downstream services may add — gateway CorsWebFilter is the single source of truth
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers Access-Control-Allow-Credentials Access-Control-Max-Age, RETAIN_LAST

# ───────── ACTUATOR ─────────
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# ───────── EUREKA CLIENT ─────────
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.ip-address=127.0.0.1
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=127.0.0.1
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ───────── LOGGING ─────────
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.flowboard.gateway=DEBUG
logging.level.reactor.netty=WARN